name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run build

      - name: Deploy dist/ to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Salva i 3 file di dist prima di cambiare branch
          mkdir -p /tmp/deploy-dist
          cp -r dist/. /tmp/deploy-dist/

          # Crea/resetta branch gh-pages (solo questi 3 file, niente node_modules)
          git fetch origin gh-pages 2>/dev/null && git checkout gh-pages || git checkout --orphan gh-pages
          # Rimuovi tutto tranne .git
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} + 2>/dev/null || true
          # Copia solo il build
          cp -r /tmp/deploy-dist/. .
          git add -A
          git status --short
          git commit -m "deploy: ${{ github.sha }}" || echo "Nothing to commit"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" gh-pages --force
